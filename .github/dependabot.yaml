version: 2
updates:
  
  - package-ecosystem: "github-actions"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: auto

  - package-ecosystem: "docker"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
