version: 2
updates:
  
  - package-ecosystem: "github-actions"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: auto
    groups:
      angular-packages:
        patterns:
          - "@angular/*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"

  - package-ecosystem: "docker"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
